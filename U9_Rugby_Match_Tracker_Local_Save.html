<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="U9 Rugby"><title>U9 Rugby Match Tracker</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:12px 12px 28px}h1{text-align:center;font-size:24px;margin:4px 0 8px}#timer{text-align:center;font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 8px}.top{display:flex;justify-content:center;margin-bottom:8px}button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:48px;padding:10px 14px}.timer{background:white;border:1px solid #ccc}.events{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;z-index:10;background:#f2f2f7;padding:8px 0}.event{background:#d1d1d6;color:#555;font-size:18px}.event.active{background:#1677ff;color:white}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}.player{background:#fff;border:1px solid #ccc;min-height:82px;font-size:21px;box-shadow:0 1px 2px #bbb}.player:active{transform:scale(.97);background:#e8f1ff}.player input{width:100%;height:100%;min-height:80px;border:0;background:transparent;text-align:center;font:inherit;font-weight:700;outline:0;padding:8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.actions button{background:#fff;border:1px solid #ccc;font-size:14px}.panel{background:#fff;border-radius:12px;padding:12px;margin-top:12px}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:center}th:first-child,td:first-child{text-align:left}.log{max-height:300px;overflow:auto}.logrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}.note{text-align:center;color:#666;font-size:12px;margin-top:9px}.danger{color:#b00020}@media(min-width:560px){.players{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><h1>U9 Rugby Match Tracker</h1><div id="timer">00:00</div><div class="top"><button class="timer" id="timerBtn">Start</button></div><div class="events"><button class="event active" data-event="PASS">PASS</button><button class="event" data-event="TACKLE">TACKLE</button><button class="event" data-event="TRY">TRY</button></div><div id="players" class="players"></div><div class="actions"><button id="undoBtn">Undo</button><button id="statsBtn">Stats</button><button id="logBtn">Log</button><button id="resetBtn" class="danger">Reset</button></div><div id="statsPanel" class="panel hidden"><h2>Match Stats</h2><table><thead><tr><th>Player</th><th>Pass</th><th>Tackle</th><th>Try</th></tr></thead><tbody id="statsBody"></tbody></table></div><div id="logPanel" class="panel hidden"><h2>Event Log</h2><div id="logBody" class="log"></div></div><div class="note">Player names and match events are saved automatically on this device.</div></div><script>
const KEY='u9-rugby-match-v2';const defaults=['Bay','Connie','Primrose','Fifi','Lottie','Nancy','Quinn','Extra 1','Extra 2','Extra 3'];let state={players:[...defaults],events:[],elapsed:0,selected:'PASS',running:false},timerId=null,last=0;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state={...state,...s};state.running=false}catch(e){}}function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,running:false}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function timeText(v){v=Math.floor(v);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function render(){document.getElementById('timer').textContent=timeText(state.elapsed);document.querySelectorAll('.event').forEach(b=>b.classList.toggle('active',b.dataset.event===state.selected));const box=document.getElementById('players');box.innerHTML='';state.players.forEach((name,i)=>{const b=document.createElement('button');b.className='player';const input=document.createElement('input');input.value=name;input.setAttribute('aria-label','Player name');input.addEventListener('click',e=>e.stopPropagation());input.addEventListener('change',()=>{state.players[i]=input.value.trim()||defaults[i];input.value=state.players[i];save();updateStats()});b.appendChild(input);b.addEventListener('click',()=>record(name));box.appendChild(b)});updateStats();updateLog()}
function selectEvent(e){state.selected=e;save();render()}function record(player){state.events.push({time:state.elapsed,event:state.selected,player});save();updateStats();updateLog()}
function updateStats(){const c={};state.players.forEach(p=>c[p]={PASS:0,TACKLE:0,TRY:0});state.events.forEach(e=>{if(!c[e.player])c[e.player]={PASS:0,TACKLE:0,TRY:0};c[e.player][e.event]++});document.getElementById('statsBody').innerHTML=state.players.map(p=>`<tr><td>${esc(p)}</td><td>${c[p].PASS}</td><td>${c[p].TACKLE}</td><td>${c[p].TRY}</td></tr>`).join('')}
function updateLog(){document.getElementById('logBody').innerHTML=[...state.events].reverse().map(e=>`<div class="logrow"><span>${timeText(e.time)} — <b>${e.event}</b></span><span>${esc(e.player)}</span></div>`).join('')||'No events yet.'}
function toggleTimer(){if(state.running){state.running=false;clearInterval(timerId);save();document.getElementById('timerBtn').textContent='Start';return}state.running=true;last=performance.now();document.getElementById('timerBtn').textContent='Pause';clearInterval(timerId);timerId=setInterval(()=>{const now=performance.now();state.elapsed+=(now-last)/1000;last=now;document.getElementById('timer').textContent=timeText(state.elapsed)},250)}
function undo(){if(state.events.length){state.events.pop();save();updateStats();updateLog()}}function resetMatch(){if(confirm('Reset the current match and clear all events?')){clearInterval(timerId);state.elapsed=0;state.running=false;state.events=[];save();document.getElementById('timerBtn').textContent='Start';render()}}
function panel(id){document.getElementById('statsPanel').classList.toggle('hidden',id!=='stats');document.getElementById('logPanel').classList.toggle('hidden',id!=='log');if(id)document.getElementById(id+'Panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
document.querySelectorAll('.event').forEach(b=>b.addEventListener('click',()=>selectEvent(b.dataset.event)));document.getElementById('timerBtn').addEventListener('click',toggleTimer);document.getElementById('undoBtn').addEventListener('click',undo);document.getElementById('statsBtn').addEventListener('click',()=>panel('stats'));document.getElementById('logBtn').addEventListener('click',()=>panel('log'));document.getElementById('resetBtn').addEventListener('click',resetMatch);load();render();</script></body></html>
